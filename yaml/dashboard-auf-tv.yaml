# Skript: eine Ansicht des Dashboards per Google Cast auf den Fernseher bringen
alias: "Dashboard auf TV"
description: Zeigt eine Ansicht des Dashboards per Chromecast auf dem Fernseher an.
icon: mdi:television-guide
mode: restart
fields:
  ansicht:
    name: Ansicht
    description: Welche Ansicht angezeigt werden soll
    required: false
    default: zuhause
    selector:
      select:
        options:
          - { label: Zuhause, value: zuhause }
          - { label: Solar, value: solar }
          - { label: Energie, value: energie }
          - { label: Klima, value: klima }
          - { label: Sicherheit, value: sicherheit }
          - { label: Haushalt, value: haushalt }
          - { label: Batterien, value: batterien }
sequence:
  # Alte Cast-Sitzung beenden; HA hält sie sonst für aktiv,
  # wenn sie per Fernbedienung weggedrückt wurde.
  - action: media_player.turn_off
    continue_on_error: true
    target:
      entity_id: media_player.wohnzimmer_tv
  - delay:
      seconds: 3
  - action: cast.show_lovelace_view
    data:
      entity_id: media_player.wohnzimmer_tv
      dashboard_path: luxury-dashboard
      view_path: "{{ ansicht | default('zuhause') }}"
